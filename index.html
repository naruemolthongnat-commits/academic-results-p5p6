<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งผลการเรียนออนไลน์ - โรงเรียนวัดหงส์ปทุมาวาส</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fdfbff;
            font-family: sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .line-fallback {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 9999;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .btn-open {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #06C755;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
    <script>
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera || "";
            var isLine = /line/i.test(ua);
            var isAndroid = /android/i.test(ua);

            if (isLine) {
                if (isAndroid) {
                    // เปิด Chrome บน Android ด้วยโปรโตคอล googlechrome:// โดยตรง
                    var cleanUrl = window.location.href.replace(/^https?:\/\//, '').split('?')[0];
                    window.location.href = "googlechrome://" + cleanUrl;
                } else {
                    // สำหรับ iOS / iPhone
                    var gasUrl = "https://script.google.com/macros/s/AKfycbwHefWIDVNBKmCXO06a1DBs4fPl2kVwsfg89ARq8dYZ7fTMfXRYpGeMLJJcAqTznE5T/exec?openExternalBrowser=1";
                    window.location.replace(gasUrl);
                }

                // แสดงปุ่มสำรองกรณีแอปไม่เด้งเปิดเบราว์เซอร์อัตโนมัติ
                setTimeout(function() {
                    document.getElementById('fallbackContainer').style.display = 'block';
                }, 1000);
            }
        })();
    </script>
</head>
<body>

    <!-- หน้าจอสำรองสำหรับกดเปิดเอง -->
    <div id="fallbackContainer" class="line-fallback">
        <h3>📣 ระบบแจ้งผลการเรียนออนไลน์</h3>
        <p>กรุณากดปุ่มด้านล่างเพื่อเปิดระบบผ่านเบราว์เซอร์ภายนอก</p>
        <a id="directLink" href="https://script.google.com/macros/s/AKfycbwHefWIDVNBKmCXO06a1DBs4fPl2kVwsfg89ARq8dYZ7fTMfXRYpGeMLJJcAqTznE5T/exec?openExternalBrowser=1" class="btn-open" target="_blank">คลิกที่นี่เพื่อเข้าสู่ระบบ</a>
    </div>

    <!-- โหลด Web App เมื่อเปิดบน Chrome/Safari ปกติ -->
    <iframe src="https://script.google.com/macros/s/AKfycbwHefWIDVNBKmCXO06a1DBs4fPl2kVwsfg89ARq8dYZ7fTMfXRYpGeMLJJcAqTznE5T/exec"></iframe>

</body>
</html>
